<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Profile Card</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<div class="card">
			<div class="head">
				<img id="profile-photo" src="./src/test.jpg" alt="My profile photo" />
			</div>
			<div class="body">
				<p class="name">user#0000</p>
				<p class="work">Working at ...</p>
				<div class="social-media-icons">
					<img
						src="./src/facebook.svg"
						alt="facebook-icon"
						class="social-icon"
						id="facebook" />
					<img
						src="./src/twitter.svg"
						alt="twitter-icon"
						class="social-icon"
						id="twitter" />
					<img
						src="./src/instagram.svg"
						alt="instagram-icon"
						class="social-icon"
						id="instagram" />
					<img
						src="./src/youtube.svg"
						alt="youtube-icon"
						class="social-icon"
						id="youtube" />
				</div>
				<div class="buttons">
					<button id="subscribe">Subscribe</button>
					<button id="message">Message</button>
				</div>
				<div class="stats">
					<div class="shortcut-media-container">
						<img src="./src/like.svg" alt="like-icon" class="icon" id="like" />
						<p class="number" id="number-likes">4Mrd</p>
					</div>

					<img src="./src/separator.svg" alt="separator-icon" id="separator" />

					<div class="shortcut-media-container">
						<img src="./src/comment.svg" alt="comment-icon" class="icon" id="comment" />
						<p class="number" id="number-comments">4Mrd</p>
					</div>

					<img src="./src/separator.svg" alt="separator-icon" id="separator" />

					<div class="shortcut-media-container">
						<img src="./src/share.svg" alt="share-icon" class="icon" id="share" />
						<p class="number" id="number-shares">4Mrd</p>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
